<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 26 960 284" width="960" height="284" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#444"/>
    </marker>
  </defs>
  <rect y="26" width="960" height="284" fill="#ffffff"/>

  <!-- data (blue) -->
  <g fill="#dce8f6" stroke="#9db8dc" stroke-width="1">
    <rect x="12" y="44" width="144" height="52" rx="8"/>
    <rect x="12" y="134" width="144" height="52" rx="8"/>
    <rect x="12" y="234" width="144" height="52" rx="8"/>
  </g>
  <g font-size="15" fill="#222" text-anchor="middle">
    <text x="84" y="66" font-weight="bold">Mesh points</text>
    <text x="84" y="86">x, d, n</text>
    <text x="84" y="156" font-weight="bold">Condition</text>
    <text x="84" y="176">U<tspan dy="4" font-size="11">∞</tspan><tspan dy="-4">, α</tspan></text>
    <text x="84" y="256" font-weight="bold">Query points</text>
    <text x="84" y="276">x, d, n</text>
  </g>

  <!-- 1: similarity inputs (fixed transform, highlighted) -->
  <rect x="186" y="122" width="168" height="176" rx="8" fill="#ffffff" stroke="#1f4e99" stroke-width="2.5"/>
  <g font-size="15" fill="#222" text-anchor="middle">
    <text x="270" y="146" font-weight="bold">① Similarity inputs</text>
    <text x="270" y="176">log Re, sin α, cos α</text>
    <text x="270" y="256">d·Re<tspan dy="-6" font-size="11">0.9</tspan><tspan dy="6">,  d·Re</tspan><tspan dy="-6" font-size="11">0.2</tspan></text>
    <text x="270" y="276">x, n, sin α, cos α</text>
  </g>

  <!-- 2: tokens (learned) -->
  <g fill="#fde3d3" stroke="#e8a27c" stroke-width="1">
    <rect x="384" y="44" width="168" height="52" rx="8"/>
    <rect x="384" y="134" width="168" height="52" rx="8"/>
  </g>
  <g font-size="15" fill="#222" text-anchor="middle">
    <text x="468" y="66" font-weight="bold">② Block tokens</text>
    <text x="468" y="86">k-d blocks, max-pool</text>
    <text x="468" y="156" font-weight="bold">② Condition tokens</text>
    <text x="468" y="176">one per parameter</text>
  </g>

  <!-- 3: trunk (pretrained, learned) -->
  <rect x="582" y="44" width="168" height="142" rx="8" fill="#f9c9ab" stroke="#e8a27c" stroke-width="1"/>
  <g font-size="15" fill="#222" text-anchor="middle">
    <text x="666" y="106" font-weight="bold">③ OmniArch trunk</text>
    <text x="666" y="128">8 pretrained blocks</text>
  </g>

  <!-- 4: decoder (learned) -->
  <rect x="582" y="234" width="168" height="52" rx="8" fill="#fde3d3" stroke="#e8a27c" stroke-width="1"/>
  <g font-size="15" fill="#222" text-anchor="middle">
    <text x="666" y="256" font-weight="bold">④ Cross-attention</text>
    <text x="666" y="276">decoder, any point</text>
  </g>

  <!-- 5: back to physical units (fixed transform, highlighted) -->
  <rect x="780" y="222" width="168" height="76" rx="8" fill="#ffffff" stroke="#1f4e99" stroke-width="2.5"/>
  <g font-size="15" fill="#222" text-anchor="middle">
    <text x="864" y="246" font-weight="bold">⑤ Physical units</text>
    <text x="864" y="268">u/U, v/U, C<tspan dy="4" font-size="11">p</tspan><tspan dy="-4">, </tspan><tspan font-family="Times New Roman, Times, serif" font-style="italic" font-size="17">ν</tspan><tspan dy="4" font-size="11">t</tspan><tspan dy="-4">/</tspan><tspan font-family="Times New Roman, Times, serif" font-style="italic" font-size="17">ν</tspan></text>
    <text x="864" y="288">→ u, v, p, <tspan font-family="Times New Roman, Times, serif" font-style="italic" font-size="17">ν</tspan><tspan dy="4" font-size="11">t</tspan></text>
  </g>

  <!-- arrows -->
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M156,70 H382"/>
    <path d="M156,160 H184"/>
    <path d="M156,260 H184"/>
    <path d="M354,160 H382"/>
    <path d="M354,260 H580"/>
    <path d="M552,70 H580"/>
    <path d="M552,160 H580"/>
    <path d="M666,186 V232"/>
    <path d="M750,260 H778"/>
  </g>
  <text x="674" y="214" font-size="13" fill="#555">tokens</text>

  <!-- legend -->
  <g font-size="13" fill="#444">
    <rect x="790" y="52" width="18" height="14" rx="3" fill="#dce8f6" stroke="#9db8dc"/>
    <text x="816" y="64">data</text>
    <rect x="790" y="80" width="18" height="14" rx="3" fill="#fde3d3" stroke="#e8a27c"/>
    <text x="816" y="92">learned</text>
    <rect x="790" y="108" width="18" height="14" rx="3" fill="#f9c9ab" stroke="#e8a27c"/>
    <text x="816" y="120">learned, from OmniArch</text>
    <rect x="790" y="136" width="18" height="14" rx="3" fill="#ffffff" stroke="#1f4e99" stroke-width="2"/>
    <text x="816" y="148">similarity transform</text>
  </g>
</svg>
